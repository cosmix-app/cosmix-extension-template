name: Build and Deploy Extension

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ExampleProvider .csx
        run: ./gradlew ExampleProvider:makeCsx

      - name: Generate plugins.json
        run: ./gradlew makePluginsJson

      - name: Prepare build directory
        run: |
          mkdir -p build
          cp ExampleProvider/build/ExampleProvider.csx build/
          cp ExampleProvider/build/ExampleProvider.jar build/

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          token: ${{ secrets.GITHUB_TOKEN }}
